name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: mariofronza/siga-bot

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: application
          path: application/build/distributions/application.tar
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  image:
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sigabot
          POSTGRES_USER: sigabot
          POSTGRES_PASSWORD: sigabot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigabot -d sigabot"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: application
          path: application/build/distributions

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name siga-bot --network host \
            -e DATASOURCE_URL=jdbc:postgresql://localhost:5432/sigabot \
            -e DATASOURCE_USERNAME=sigabot \
            -e DATASOURCE_PASSWORD=sigabot \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e SECRETKEY="$(openssl rand -hex 16)" \
            -e ONESIGNAL_APIKEY=smoke-test \
            "$IMAGE_REF"
          for _ in $(seq 60); do
            case "$(docker inspect -f '{{.State.Running}} {{.State.Health.Status}}' siga-bot)" in
              "true healthy") exit 0 ;;
              "true starting") sleep 3 ;;
              *) break ;;
            esac
          done
          docker inspect -f 'status={{.State.Status}} health={{.State.Health.Status}} exit={{.State.ExitCode}}' siga-bot
          docker logs siga-bot
          exit 1

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: github.event_name == 'push'
        run: docker push --all-tags ${{ env.IMAGE }}
