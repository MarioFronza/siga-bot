# Every key can be overridden by its env var form (jwt.secret -> JWT_SECRET).
# Required env vars: JWT_SECRET, SECRETKEY, ONESIGNAL_APIKEY,
# DATASOURCE_URL, DATASOURCE_USERNAME, DATASOURCE_PASSWORD
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.data.web.pageable.max-page-size=100
springdoc.api-docs.path=/api/v1/openapi.json
springdoc.paths-to-match=/api/**

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
