# Every key can be overridden by its env var form (jwt.secret -> JWT_SECRET).
# Required env vars: JWT_SECRET, SECRETKEY, ONESIGNAL_APIKEY, SIGA_YEAR, SIGA_TERM,
# DATASOURCE_URL, DATASOURCE_USERNAME, DATASOURCE_PASSWORD
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
# Flyway owns the schema (persistence/src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
