services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/sigabot
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_DB: sigabot
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sigabot"]
      interval: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
